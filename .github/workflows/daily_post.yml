name: YouTube Auto Publisher

on:
  schedule:
    # 1️⃣ USA: 8:00 AM (ET) | India: 6:30 PM (IST) | UTC: 1:00 PM
    - cron: '0 13 * * *'

    # 2️⃣ USA: 1:00 PM (ET) | India: 11:30 PM (IST) | UTC: 6:00 PM
    - cron: '0 18 * * *'

    # 3️⃣ USA: 8:00 PM (ET) ⭐ Best | India: 5:30 AM (IST - Next Day) | UTC: 1:00 AM (Next Day)
    - cron: '0 1 * * *'
  workflow_dispatch: # Button to run manually for testing

jobs:
  publish_video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Python & Libraries
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Automation Script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python youtube_auto.py
